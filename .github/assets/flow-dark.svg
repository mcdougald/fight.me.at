<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a0a0a" opacity="0.8"><tspan x="728" dy="0">Every peer</tspan><tspan x="728" dy="19">reaches the same</tspan><tspan x="728" dy="19">document.</tspan></text>

<text x="24" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="24" dy="0">The relay is written but has never been deployed. The convergence code is tested and runs in your browser today.</tspan></text>
