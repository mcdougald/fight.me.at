<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="212" dy="0">Order</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="212" dy="0">Wall time, then</tspan><tspan x="212" dy="19">actor id, then</tspan><tspan x="212" dy="19">value.</tspan></text>
